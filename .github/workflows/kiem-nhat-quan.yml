name: kiem-nhat-quan
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  kiem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -I scripts/kiem-nhat-quan.py
